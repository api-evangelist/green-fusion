name: Green Fusion
description: 'Green Fusion GmbH is a Berlin-based climate-energy software company that
  provides an intelligent 360-degree energy management platform for the residential
  real estate sector (Wohnungswirtschaft). Its software digitizes and optimizes building
  heating systems: "Der Energiespar-Pilot" delivers digital boiler-room management
  and optimized operation of conventional heat sources (gas, oil, district heating,
  CHP/BHKW), while its AI platform for sector coupling (Sektorkopplung) integrates
  heat pumps, PV systems, storage, and grid connectivity for intelligent monitoring
  and control. The platform is TUV-certified under GEG section 71a. Green Fusion is
  backed by HV Capital and surfaced in the API Evangelist network as a climate-energy
  provider; it operates a customer control platform (control.green-fusion.de) but
  publishes no public developer API at this time.'
